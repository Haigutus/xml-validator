# Push to main → build image → deploy Cloud Run (WIF).
# Variables: GCP_PROJECT_ID, GCP_REGION, SERVICE_NAME, AR_REPO,
#            GCP_SERVICE_ACCOUNT, GCP_WORKLOAD_IDENTITY_PROVIDER
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.SERVICE_NAME }}
  AR_REPO: ${{ vars.AR_REPO }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: meta
        run: |
          sha=$(git rev-parse --short HEAD)
          count=$(git rev-list --count HEAD)
          base=${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}
          echo "image=${base}:${sha}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${base}:latest" >> "$GITHUB_OUTPUT"
          echo "git_commit_count=${count}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          build-args: GIT_COMMIT_COUNT=${{ steps.meta.outputs.git_commit_count }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ vars.SERVICE_NAME }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ needs.build.outputs.image }}
          env_vars: |-
            XSD_DIR=/app/XSD
            MAX_XML_BYTES=10485760
            PYTHONDONTWRITEBYTECODE=1
            PYTHONUNBUFFERED=1
          env_vars_update_strategy: overwrite
          timeout: 60s
          flags: >-
            --allow-unauthenticated
            --port=8080
            --memory=512Mi
            --cpu=1
            --cpu-boost
            --min-instances=0
            --max-instances=2
            --concurrency=40
            --execution-environment=gen1
            --startup-probe=httpGet.path=/healthz,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=2,periodSeconds=3,failureThreshold=15
            --liveness-probe=httpGet.path=/healthz,httpGet.port=8080,timeoutSeconds=3,periodSeconds=30,failureThreshold=3
