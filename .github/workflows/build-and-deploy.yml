# Build image → Artifact Registry → deploy Cloud Run (linked jobs).
# Auth: Workload Identity Federation (no SA keys).
# Trigger: push to main + manual workflow_dispatch.
#
# Repo variables: GCP_PROJECT_ID, GCP_SERVICE_ACCOUNT,
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_REGION, AR_REPO, SERVICE_NAME
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.SERVICE_NAME }}
  AR_REPO: ${{ vars.AR_REPO }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      # checkout must run before google-github-actions/auth (credentials land in workspace)
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          count="$(git rev-list --count HEAD)"
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${short_sha}"
          image_latest="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}:latest"
          {
            echo "short_sha=${short_sha}"
            echo "git_commit_count=${count}"
            echo "image=${image}"
            echo "image_latest=${image_latest}"
          } >> "${GITHUB_OUTPUT}"
          echo "Building app 0.2.${count} → ${image}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # OAuth access token for registry login (official auth output path)
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          build-args: |
            GIT_COMMIT_COUNT=${{ steps.meta.outputs.git_commit_count }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false

  deploy:
    name: Deploy Cloud Run
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          service: ${{ vars.SERVICE_NAME }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ needs.build.outputs.image }}
          env_vars: |-
            XSD_DIR=/app/XSD
            MAX_XML_BYTES=10485760
            PYTHONDONTWRITEBYTECODE=1
            PYTHONUNBUFFERED=1
          env_vars_update_strategy: overwrite
          timeout: 60s
          # Free-tier / cold-start profile (flags not exposed as first-class inputs)
          flags: >-
            --allow-unauthenticated
            --port=8080
            --memory=512Mi
            --cpu=1
            --cpu-boost
            --min-instances=0
            --max-instances=2
            --concurrency=40
            --execution-environment=gen1
            --startup-probe=httpGet.path=/healthz,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=2,periodSeconds=3,failureThreshold=15
            --liveness-probe=httpGet.path=/healthz,httpGet.port=8080,timeoutSeconds=3,periodSeconds=30,failureThreshold=3

      - name: Deployment URL
        run: |
          echo "Live: ${{ steps.deploy.outputs.url }}"
          echo "Custom domain (if mapped): https://xsd.cimtools.eu"
