# Alias of compose.yml for tools that look for docker-compose.yml
services:
  xml-validator:
    build:
      context: .
      dockerfile: Containerfile
      args:
        GIT_COMMIT_COUNT: ${GIT_COMMIT_COUNT:-0}
    image: xml-validator:latest
    ports:
      - "${HOST_PORT:-8030}:8080"
    environment:
      PORT: "8080"
      XSD_DIR: /app/XSD
    restart: unless-stopped
