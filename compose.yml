# Local Podman / Docker Compose
# Default: use XSD baked into the image (same as Cloud Run).
# Optional host override: HOST_XSD=1 podman compose up --build
#
#   export GIT_COMMIT_COUNT=$(git rev-list --count HEAD)
#   export PODMAN_COMPOSE_PROVIDER=podman-compose   # if snap docker-compose conflicts
#   podman compose up --build -d

services:
  xml-validator:
    build:
      context: .
      dockerfile: Containerfile
      args:
        GIT_COMMIT_COUNT: ${GIT_COMMIT_COUNT:-0}
    image: xml-validator:latest
    ports:
      - "${HOST_PORT:-8030}:8080"
    environment:
      PORT: "8080"
      XSD_DIR: /app/XSD
    # Uncomment or set HOST_XSD=1 via override — see scripts/run.sh
    # volumes:
    #   - ./XSD:/app/XSD:ro
    restart: unless-stopped
